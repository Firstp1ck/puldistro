sächlich für Spiele","weights":{"gaming":3,"nvidia":1,"windowsLike":1}},{"label":"Ich kann Partitionen manuell verwalten","weights":{"manual":2,"expert":1}}],"tier":3},{"id":38,"category":"Speichersicherheit","text":"Sind dir fortgeschrittene Speicherfunktionen zum Rückgängigmachen oder Schutz von Daten wichtig?","hint":"Manche Dateisysteme können Snapshots und Rollbacks erleichtern.","answers":[{"label":"Nein","weights":{"beginner":1}},{"label":"Snapshots klingen nützlich","weights":{"security":2,"rolling":1}},{"label":"Ich möchte das automatisch konfiguriert haben","weights":{"automated":2,"immutable":2}},{"label":"Ich möchte fortgeschrittene manuelle Speicherkontrolle","weights":{"expert":3,"manual":3,"server":1}}],"tier":3},{"id":39,"category":"Wiederholbarer Aufbau","text":"Wie wichtig ist es, dass du dasselbe Setup später wieder aufbauen kannst?","hint":"Das bedeutet, dass deine Systemeinstellungen gespeichert und vorhersehbar neu erstellt werden können, oft als Code.","answers":[{"label":"Nicht wichtig","weights":{"beginner":1}},{"label":"Meine persönlichen Einstellungen zu sichern reicht","weights":{"developer":1,"customization":1}},{"label":"Wichtig","weights":{"developer":3,"manual":2}},{"label":"Erforderlich","weights":{"developer":5,"manual":4,"expert":2}}],"tier":3},{"id":40,"category":"Einrichtungszeit","text":"Wie viel Zeit kannst du für die Einrichtung investieren?","hint":"Fertige Systeme sind schneller. Do-it-yourself-Systeme dauern länger, geben aber mehr Kontrolle.","answers":[{"label":"Unter 30 Minuten","weights":{"beginner":4,"automated":4}},{"label":"Ein paar Stunden","weights":{"customization":1,"developer":1}},{"label":"Ein Wochenende","weights":{"manual":3,"expert":2}},{"label":"So lange es dauert","weights":{"manual":5,"expert":4,"sourceBased":3}}],"tier":3},{"id":41,"category":"Tastaturnutzung","text":"Wie tastaturgesteuert soll die tägliche Nutzung sein?","hint":"Manche Setups sind mausorientiert. Andere bauen auf Shortcuts, Terminals und Text-Konfigurationsdateien.","answers":[{"label":"Meist Maus und normale grafische Apps","weights":{"beginner":3,"automated":3}},{"label":"Einige Shortcuts, aber normales Desktop-Verhalten","weights":{"kde":1,"gnome":1,"developer":1}},{"label":"Tastaturorientiert, mit häufiger Kommandozeilennutzung","weights":{"keyboardDriven":4,"tilingWM":3,"developer":3,"manual":2}},{"label":"Fast alles über Shortcuts, Terminal und Einstellungsdateien","weights":{"keyboardDriven":6,"tilingWM":5,"expert":3,"manual":4,"minimal":2}}],"tier":3},{"id":42,"category":"Apps aktualisieren","text":"Wie sollen Updates passieren?","hint":"Einsteigerfreundliche Systeme bieten meist grafische Update-Werkzeuge. Technische Systeme nutzen oft Befehle.","answers":[{"label":"Über eine grafische Update-App","weights":{"beginner":4,"automated":3}},{"label":"Grafische App oder Befehl ist beides okay","weights":{"automated":1,"community":1}},{"label":"Ein Terminalbefehl ist okay","weights":{"developer":2,"manual":2}},{"label":"Ich möchte explizite Kontrolle über jedes Update","weights":{"manual":4,"expert":3}}],"tier":3},{"id":43,"category":"Firmen-Integrationen","text":"Wie stehst du zu App-Stores, Snap-Paketen oder Hersteller-Integrationen?","hint":"Das beeinflusst, ob Empfehlungen eher Richtung Bequemlichkeit oder Community-first gehen.","answers":[{"label":"Bequemlichkeit ist okay","weights":{"commercialFriendly":3,"beginner":2,"automated":1}},{"label":"Neutral","weights":{}},{"label":"Ich bevorzuge Community-Pakete","weights":{"community":3,"privacy":2}},{"label":"Ich vermeide firmengesteuerte Defaults stark","weights":{"privacy":5,"community":3,"minimal":1}}],"tier":3},{"id":44,"category":"Zuverlässigkeit","text":"Brauchst du langweilige Zuverlässigkeit für Arbeit oder Schule?","hint":"Wichtige Maschinen sollten unnötige Unruhe und riskante Experimente vermeiden.","answers":[{"label":"Ja, es muss langweilig und zuverlässig sein","weights":{"stable":5,"automated":2}},{"label":"Meistens, aber ich mag moderne Apps","weights":{"stable":2,"fresh":2}},{"label":"Ich kann etwas Veränderung tolerieren","weights":{"fresh":2,"rolling":2}},{"label":"Das ist hauptsächlich eine Bastelmaschine","weights":{"manual":3,"expert":2,"rolling":2}}],"tier":3},{"id":45,"category":"Windows-Apps","text":"Bist du auf Apps angewiesen, die nur unter Windows gut laufen?","hint":"Das ist oft der größte Umstiegsblocker: Adobe-Apps, CAD, Buchhaltung, Steuerprogramme und Firmen-Apps brauchen eventuell weiterhin Windows.","answers":[{"label":"Nein, hauptsächlich Browser-/Open-Source-/Cross-Platform-Apps","weights":{"webApps":4,"privacy":1,"community":1}},{"label":"Microsoft-Office-Dateikompatibilität ist wichtig","weights":{"officeCompat":5,"commercialFriendly":2,"dualBootRecommended":1}},{"label":"Adobe-/CAD-/Engineering-/Buchhaltungsapps sind erforderlich","weights":{"proWindowsApps":6,"creative":2,"commercialFriendly":2,"dualBootRecommended":4}},{"label":"Firmen- oder Schul-Windows-Apps sind erforderlich","weights":{"proWindowsApps":4,"commercialFriendly":3,"dualBootRecommended":5,"stable":1}}],"tier":3},{"id":46,"category":"Spielekompatibilität","text":"Brauchst du Spiele, die Linux wegen Anti-Cheat blockieren?","hint":"Viele Steam-Spiele funktionieren gut, aber manche kompetitiven Spiele blockieren Linux vollständig oder ändern ihren Support häufig.","answers":[{"label":"Keine kompetitiven/Anti-Cheat-Spiele","weights":{}},{"label":"Hauptsächlich Steam-Spiele; ich kann Kompatibilitätsberichte prüfen","weights":{"gaming":2,"fresh":1}},{"label":"Ja, einige Anti-Cheat-Spiele sind wichtig","weights":{"antiCheat":5,"gaming":4,"dualBootRecommended":3}},{"label":"Diese Spiele sind nicht verhandelbar","weights":{"antiCheat":8,"gaming":5,"dualBootRecommended":6,"commercialFriendly":2}}],"tier":3},{"id":47,"category":"Hardware-Apps","text":"Bist du auf Hersteller-Steuerungsapps angewiesen?","hint":"RGB-Beleuchtung, Mausmakros, Stream Decks, Audiointerfaces, Druckersuiten und Lüftersteuerung können schwieriger sein als die Hardware selbst.","answers":[{"label":"Keine speziellen Hersteller-Apps","weights":{}},{"label":"Basis-Support für Drucker/Scanner/Peripherie reicht","weights":{"beginner":1,"stable":1}},{"label":"RGB-/Maus-/Headset-/Lüftersteuerungsapps sind wichtig","weights":{"vendorUtilities":4,"dualBootRecommended":2,"gaming":1}},{"label":"Streaming-/Audio-/Produktions-Hardwaretools sind kritisch","weights":{"vendorUtilities":6,"creative":3,"dualBootRecommended":4}}],"tier":3},{"id":48,"category":"Fallback-Plan","text":"Was ist akzeptabel, wenn eine benötigte App unter Linux nicht gut läuft?","hint":"Die sicherste Antwort kann Linux plus weiterhin verfügbares Windows für bestimmte Aufgaben sein.","answers":[{"label":"Ich kann Web-Apps oder Linux-Alternativen nutzen","weights":{"webApps":4,"privacy":1}},{"label":"Ich kann für seltene Fälle in Windows neu starten","weights":{"dualBootRecommended":3,"manual":1}},{"label":"Ich kann Windows in einer virtuellen Maschine ausführen","weights":{"dualBootRecommended":2,"developer":1,"expert":1}},{"label":"Alles muss direkt unter Linux funktionieren","weights":{"proWindowsApps":3,"officeCompat":2,"antiCheat":2,"commercialFriendly":2}}],"tier":3},{"id":49,"category":"Akku vs. Geschwindigkeit","text":"Worauf sollen die Voreinstellungen optimieren?","hint":"Performanceorientierte Systeme können weniger konservativ sein. Laptoporientierte Systeme bevorzugen meist Balance und Akku.","answers":[{"label":"Akkulaufzeit und leiser Betrieb","weights":{"laptop":4,"stable":1}},{"label":"Ausgewogen","weights":{"laptop":1,"modernDesktop":1}},{"label":"Performance","weights":{"gaming":3,"fresh":2}},{"label":"Maximal getunte Performance","weights":{"gaming":5,"expert":2,"fresh":3}}],"tier":3},{"id":50,"category":"Abschließende Präferenz","text":"Welche abschließende Empfehlung würde dich am glücklichsten machen?","hint":"Ein letzter starker Präferenzmarker.","answers":[{"label":"Zuverlässiger Alltagscomputer","weights":{"beginner":3,"stable":4,"automated":3}},{"label":"Moderne Programmier-Workstation","weights":{"developer":5,"fresh":3,"modernDesktop":2}},{"label":"Gaming-/Performance-Maschine","weights":{"gaming":5,"fresh":2,"nvidia":2}},{"label":"Do-it-yourself-Power-User-System","weights":{"expert":5,"manual":5,"customization":4}}],"tier":3}]
