glossary_json = """
{"anti-cheat":"Game protection Software used zu stop cheating. Some anti-cheat Systeme do not allow Linux.","Arch":"A Linux family known für user Kontrolle, häufige Updates, und aktive Wartung.","Btrfs":"A Speicherformat that can Snapshots unterstützen, which are gespeicherte Wiederherstellungspunkte.","Cinnamon":"A traditional desktop Interface that feels familiar zu many Windows users.","codecs":"Small Software components that let your Computer play oder create audio/video formats.","compile":"Build Software von source code instead von installing a ready-made App package.","config files":"Text Dateien that store system oder App Einstellungen.","containers":"Isolated environments für Apps oder development Werkzeuge.","Debian":"A Linux family known für stability, long history, und a large Software base.","desktop environment":"The full grafisch Interface: panels, menus, Einstellungen App, file manager, und window behavior.","distro":"Short für Linux-Distribution: a complete Linux-based operating system you can install.","dual-boot":"Keeping two operating Systeme installed, such as Windows und Linux, und choosing one when Computer starts.","driver":"Software that lets operating system talk zu Hardware like graphics cards, Wi‑Fi, und printers.","firmware":"Small built-in Software inside Hardware devices.","Flatpak":"An App format that works across many Linux Systeme, often installed through grafisch App stores.","GNOME":"A modern, simple Linux desktop Interface mit a focused Workflow.","GPU":"Graphics Processing Unit: chip/card that handles graphics und Spiele.","headless":"A Computer used ohne a monitor, keyboard, oder regular grafisch desktop.","homelab":"A personal home Server setup used für learning, storage, media, networking, oder experiments.","Hyprland":"A keyboard-focused Interface that automatically tiles windows auf screen.","i3":"A keyboard-focused tiling Window-Manager known für simplicity und Dokumentation.","immutable":"A system design where core system Dateien are protected, making Updates easier zu undo.","installer":"The setup program that installs operating system onto your Computer.","kernel":"The core von operating system that talks directly zu Hardware.","KDE Plasma":"A highly customizable Linux desktop Interface mit a traditional Windows-like layout.","Linux":"An open-source operating system family used auf desktops, servers, phones, und embedded devices.","Mesa":"Open-source graphics Software used by many Linux Systeme, especially für AMD und Intel graphics.","NVIDIA":"A graphics-card maker. Its Linux Treiber setup can be more sensitive than AMD oder Intel.","ProtonDB":"A Community website that reports how well Windows Spiele work auf Linux through Steam Proton.","rollback":"Going back zu an earlier working state after an Update oder change breaks something.","rolling":"An Update style where Software arrives continuously instead von in big version releases.","sandboxed":"Isolated von rest von system zu reduce risk und avoid dependency conflicts.","server":"A Computer mainly used zu provide services, such as Dateien, websites, media, oder automation.","Snap":"An App package format associated mit Ubuntu/Canonical.","snapshots":"Saved restore points von system Dateien, useful für undoing changes.","source code":"The human-readable instructions programmers write before Software is built.","stable":"Prioritizes reliability und fewer surprises, usually by changing Software more slowly.","Sway":"A keyboard-focused tiling Interface für Wayland.","terminal":"A text command window used zu Kontrolle Computer by typing commands.","tiling":"A window layout style where windows automatically arrange themselves ohne overlapping.","VM":"Virtuelle Maschine: a Computer simulated inside your current Computer, often used zu run another operating system.","Wayland":"A modern Linux display system that Kontrolles how Apps draw windows und receive input.","Xfce":"A leichtgewichtig traditional Linux desktop Interface, often gut für older Computers.","ZFS":"An advanced storage system mit strong data-management Funktionen."}
