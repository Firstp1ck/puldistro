[{"category":"Office","windows":"Microsoft Office / Microsoft 365 desktop","difficulty":"medium","summary":"Die Web-Apps funktionieren, aber die vollständigen Desktop-Versionen von Word/Excel/PowerPoint/Outlook sind unter Linux nicht nativ verfügbar. Erweiterte Excel-Makros, VBA, Access und exakte Formatierung können Windows erfordern.","alternatives":[["OnlyOffice","Beste für Microsoft Dokumentkompatibilität among nativ wirkende Linux Office-Suiten."],["LibreOffice","Leistungsstarke Open-Source-Suite; hervorragend für offene Formate, manchmal unperfekt für komplexe DOCX/XLSX."],["Microsoft 365 Web","Gut für if you can work in Browser und do not need full desktop Funktionen."],["Windows VM / Dual-Boot","Empfohlen für Access, VBA-heavy Excel, oder strict corporate templates."]],"tags":["Word","Excel","PowerPoint","Outlook","VBA"]},{"category":"Kreativ","windows":"Adobe Photoshop","difficulty":"hard","summary":"Modernes Photoshop/Creative Cloud ist unter Linux kein problemloser nativer Workflow. Wine-Hacks können existieren, sind aber keine zuverlässige Empfehlung für normale Nutzer.","alternatives":[["Krita","Hervorragend für digitales Malen und Illustration."],["GIMP","Starke Foto-/Bildeditor, but anderer Workflow und schwächerer PSD Kompatibilität."],["Photopea","Browserbasierter Photoshop-like editor für leichtere Arbeit."],["Windows Dual-Boot/VM","Beste für professionelle Photoshop-dependent Workflows."]],"tags":["Adobe","PSD","Photo editing","Design"]},{"category":"Kreativ","windows":"Adobe Illustrator / InDesign","difficulty":"hard","summary":"Professionelle Adobe-Publishing- und Vektor-Workflows lassen sich unter Linux nur schwer exakt ersetzen, besonders mit Kundendateien und Druck-Pipelines.","alternatives":[["Inkscape","Großartige open-source vector editor; gut für SVG und many Illustration Workflows."],["Scribus","Open-source desktop publishing für layout work."],["Penpot / Figma web","Gut für für Interface und kollaborative Designarbeit."],["Windows/macOS fallback","Empfohlen für Adobe-native professionelle Pipelines."]],"tags":["Adobe","Vector","Publishing","Print"]},{"category":"Kreativ","windows":"Adobe Premiere Pro / After Effects","difficulty":"medium","summary":"Adobe-VideoWerkzeuge sind nicht nativ, aber Linux hat ernstzunehmende Videoschnittoptionen. Motion-Graphics- und pluginlastige Workflows brauchen eventuell weiterhin Adobe.","alternatives":[["DaVinci Resolve","Professional editor/color tool available auf Linux; Hardware/codec setup can matter."],["Kdenlive","Friendly open-source video editor."],["Blender","Nützlich für motion graphics, compositing, und 3D."],["Windows-Fallback","Beste if you rely auf Adobe plugins oder project exchange."]],"tags":["Video","Motion graphics","Adobe","Resolve"]},{"category":"CAD/Engineering","windows":"AutoCAD / Revit / Inventor","difficulty":"hard","summary":"Autodesk-Desktop-Apps sind grundsätzlich Windows/macOS-first und unter Linux nicht problemlos. Professionelle Architektur-/Engineering-Nutzer sollten einen Windows-Fallback einplanen.","alternatives":[["FreeCAD","Open-source parametric CAD; improving but not a drop-in AutoCAD/Revit replacement."],["LibreCAD","2D CAD option für simpler drafting."],["Onshape","Browserbasierter CAD that works well auf Linux."],["Dual-Boot / Windows workstation","Empfohlen für professionelle Autodesk Workflows."]],"tags":["AutoCAD","Revit","Inventor","BIM","Drafting"]},{"category":"CAD/Engineering","windows":"SolidWorks","difficulty":"hard","summary":"SolidWorks ist keine normale native Linux-App. Wine-/VM-Versuche sind für produktive Arbeit fragil und GPU-Beschleunigung kann problematisch sein.","alternatives":[["FreeCAD","Beste open-source local alternative für parametric modeling."],["Onshape","Starke Browser CAD alternative, especially für collaboration."],["Fusion/Autodesk web Workflows","May help für some Workflows, but not full SolidWorks replacement."],["Windows machine","Most reliable choice if SolidWorks is required."]],"tags":["Mechanical CAD","Engineering","3D modeling"]},{"category":"Gaming","windows":"Steam Spiele ohne anti-cheat blockers","difficulty":"easy","summary":"Many Spiele work very well through Steam Proton, especially single-player und non-invasive multiplayer titles.","alternatives":[["Steam + Proton","Enable Proton und check ProtonDB für Spiel-specific notes."],["Heroic Games Launcher","Gut für für Epic/GOG/Amazon libraries."],["Lutris","Flexible launcher für non-Steam Spiele."],["Bottles","GUI für managing Wine prefixes für Spiele/Apps."]],"tags":["Steam","Proton","Lutris","Heroic"]},{"category":"Gaming","windows":"Valorant / Fortnite / Warzone / Destiny 2-style anti-cheat Spiele","difficulty":"hard","summary":"Kernel anti-cheat is one von biggest Linux gaming blockers. Some Spiele work, some do not, und status changes over time.","alternatives":[["Check ProtonDB","Verify exact Spiel und recent reports."],["AreWeAntiCheatYet","Quick anti-cheat Kompatibilität reference."],["Dual-Boot Windows","Beste option if these Spiele are non-negotiable."],["Cloud gaming","May work für some titles depending auf region/service."]],"tags":["Anti-cheat","Vanguard","BattlEye","EAC","Ricochet"]},{"category":"Business","windows":"QuickBooks Desktop / Sage / tax Werkzeuge / company ERP clients","difficulty":"hard","summary":"Viele Business-Tools sind Windows-only oder nur in neueren Versionen Browserkompatibel. Lokale Datenbanken, Plugins und länder-/behördenspezifische Steuersoftware können Blocker sein.","alternatives":[["Web version von same product","Often cleanest Linux-compatible route if available."],["Odoo","Open-source ERP/CRM/accounting option für some businesses."],["GnuCash","Gut für personal/small-business accounting alternative."],["Windows VM / remote desktop","Empfohlen für required legacy business Software."]],"tags":["Accounting","ERP","Tax","Company Apps"]},{"category":"Hardware","windows":"Logitech G Hub / Razer Synapse / Corsair iCUE / SteelSeries GG","difficulty":"medium","summary":"Die Geräte funktionieren oft, aber die Hersteller-Konfigurationsapps meist nicht. RGB, Makros, DPI-Profile, Firmware-Updates und Headset-Funktionen variieren.","alternatives":[["Piper","Mouse Konfiguration für many gaming mice."],["Solaar","Großartige für Logitech Unifying/Bolt devices."],["OpenRGB","Cross-vendor RGB Kontrolle für many devices."],["Windows-Fallback","Nützlich für Firmware Updates oder vendor-only Funktionen."]],"tags":["RGB","Mouse","Keyboard","Headset","Firmware"]},{"category":"Hardware","windows":"Elgato Stream Deck / capture / streaming utilities","difficulty":"medium","summary":"Streaming-Hardware kann funktionieren, aber offizielle Begleitapps sind oft Windows/macOS-first. Prüfe jedes Gerät vor dem Umstieg.","alternatives":[["OBS Studio","Hervorragend native Linux streaming/recording App."],["streamdeck-ui / Boatswain","Community Stream Deck Kontrolle options."],["v4l2 Werkzeuge","Nützlich für camera/capture troubleshooting."],["Windows-Fallback","Empfohlen if your setup depends auf vendor plugins."]],"tags":["OBS","Streaming","Capture","Stream Deck"]},{"category":"Musik","windows":"FL Studio / Ableton Live / commercial VST plugins","difficulty":"medium","summary":"Linux-Audio kann hervorragend sein, aber Windows/macOS-DAWs, Plugins, iLok/DRM und AudioInterface-Tools können schwierig sein.","alternatives":[["Bitwig Studio","Professional DAW mit native Linux support."],["REAPER","Leistungsstarke DAW available auf Linux."],["Ardour","Open-source DAW für recording/mixing."],["yabridge","Can bridge many Windows VST plugins, but requires setup."]],"tags":["DAW","VST","Audio","Plugins","iLok"]},{"category":"Entwicklung","windows":"Visual Studio / .NET desktop / SQL Server tooling","difficulty":"medium","summary":"Allgemeine Entwicklung ist unter Linux hervorragend, aber vollständiges Visual Studio, einige .NET-Desktop-Workloads und Microsoft-Enterprise-Tools bevorzugen weiterhin Windows.","alternatives":[["VS Code","Hervorragend cross-platform editor mit huge extension ecosystem."],["JetBrains IDEs","Starke Linux support across many languages."],[".NET SDK","Modern .NET development works well; check desktop workload needs."],["Dev containers","Gut für way zu isolate project environments."]],"tags":["Visual Studio",".NET","VS Code","JetBrains"]},{"category":"Kommunikation","windows":"Teams / Discord / Zoom / Slack","difficulty":"easy","summary":"Die meisten großen Kommunikationsapps haben Linux-Clients oder gute Web-Versionen, auch wenn Bildschirmfreigabe und Wayland-Support je nach App und Desktop variieren können.","alternatives":[["Native Linux clients","Discord, Slack, Zoom, und others have Linux builds."],["Web Apps","Often most stabil option für business Werkzeuge."],["Flatpak versions","Convenient App delivery across distros."],["GNOME/KDE Wayland sessions","Usually beste-supported modern desktop paths."]],"tags":["Teams","Discord","Zoom","Slack","Wayland"]}]
