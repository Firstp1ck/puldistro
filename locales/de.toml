[fallback]
title = "Windows/macOS-Fallback-Leitfaden | Puldistro"
eyebrow = "Fallback-Leitfaden für den Umstieg"
hero_title = "Halte <span class=\"gradient\">Windows oder macOS</span> bereit, wenn Linux nicht reicht."
lead = "Ein Fallback ist ein Sicherheitsplan für Apps, Spiele, Hardwaretools, Schul-/Arbeitsanforderungen oder Kreativ-Workflows, die unter Linux noch nicht gut funktionieren. So kannst du Linux für das meiste nutzen, ohne deinen Pflicht-Workflow zu riskieren."
what_title = "Was tun?"
what_1_html = "<strong>Liste deine unverzichtbaren Dinge auf.</strong> Notiere benötigte Apps, Plugins, Spiele, Peripherie, Dateiformate sowie Schul-/Arbeitstools."
what_2_html = "<strong>Teste unter Linux, bevor du etwas löschst.</strong> Probiere Live-USB, Ersatz-SSD, Ersatzrechner oder Dual-Boot."
what_3_html = "<strong>Wähle den kleinsten Fallback, der den Blocker löst.</strong> Nutze zuerst Web-Apps, dann VM/Fernzugriff, dann Dual-Boot oder einen zweiten Rechner, wenn nötig."
what_4_html = "<strong>Behalte Backups und Wiederherstellungsmedien.</strong> Sichere wichtige Dateien vor Partitionsänderungen oder Installationen und stelle sicher, dass du neu installieren oder wiederherstellen kannst."
what_5_html = "<strong>Prüfe nach ein paar Monaten erneut.</strong> Linux-App- und Spiele-Support ändert sich. Ein Blocker von heute kann später einfacher sein."
rule_html = "<strong>Faustregel:</strong> Wenn Geld, Schule, Arbeit, Kundendateien oder kompetitive Spiele davon abhängen, behalte einen bewährten Fallback, bis du den exakten Workflow getestet hast."
why_title = "Warum?"
why_1 = "Linux ist hervorragend für Webnutzung, Entwicklung, datenschutzfreundliche Desktops, viele Spiele, Server und viele Kreativ-Workflows. Einige Anbieter unterstützen aber nur Windows oder macOS. Professionelle Adobe-Pipelines, CAD/BIM-Tools, Buchhaltungssoftware, Anti-Cheat-Spiele, Firmware-Updater und Hardware-Steuerungsapps sind typische Beispiele."
why_2 = "Ein Fallback verhindert einen schlechten Umstieg: Statt einen Blocker erst nach dem Löschen deines alten Systems zu entdecken, behältst du einen zuverlässigen Weg für die wenigen Aufgaben, die noch Windows oder macOS brauchen."
possibilities_title = "Fallback-Möglichkeiten"
quick_title = "Kurze Empfehlung"
quick_text_html = "Wenn du unsicher bist, starte mit <strong>Dual-Boot auf einem separaten Laufwerk</strong> oder <strong>Linux auf einem Ersatzcomputer</strong>. So sammelst du echte Linux-Erfahrung und behältst dein altes Setup intakt. Wechsle erst vollständig, wenn deine benötigten Apps, Spiele, Geräte und Dateien zuverlässig funktionieren."
check_apps = "App-Alternativen prüfen"
read_glossary = "Glossar lesen"
take_quiz = "Distro-Quiz starten"

[about]
title = "Über | Puldistro"
eyebrow = "Über dieses Projekt"
heading = "Ein praktischer Helfer zur Linux-Auswahl."
intro = "Puldistro hilft Neueinsteigern, Linux-Distributionen und gängige App-Alternativen ohne Linux-Vorwissen zu vergleichen."
what_does = "Was es tut"
does_1 = "Stellt verständliche Fragen zu Computer, Gewohnheiten, Apps, Spielen und Wartungskomfort."
does_2 = "Empfiehlt Linux-Distributionen und Desktop-Oberflächen anhand deiner Präferenzen."
does_3 = "Hebt häufige Umstiegsblocker wie Windows-only-Apps, Anti-Cheat-Spiele und Hersteller-Hardwaretools hervor."
what_not = "Was es nicht tut"
not_text = "Es kann deinen exakten Computer nicht testen und nicht garantieren, dass jedes Gerät, Spiel oder jede Profi-App funktioniert. Bevor du Windows ersetzt, teste deinen echten Workflow mit Live-USB, separatem Laufwerk, Dual-Boot oder Ersatzgerät."

[evaluation]
title = "Bewertung | Puldistro"
eyebrow = "Bewertungsmodell"
heading = "Wie Puldistro deine Linux-Passung bewertet."
intro = "Das Quiz bewertet Linux-Distributionen nicht nach objektiver Qualität. Es vergleicht deine Antworten mit Präferenzprofilen für Distributionen, Desktop-Umgebungen und Window-Manager und zeigt danach die stärksten Treffer."
what_title = "Was wird bewertet?"
what_experience_title = "Erfahrung und Wartungskomfort"
what_experience_text = "Wie sicher du mit Linux-Konzepten, Terminalarbeit, manueller Fehlersuche, Dokumentation und Rolling Updates bist."
what_hardware_title = "Hardware- und Gerätebedarf"
what_hardware_text = "Ältere Hardware, Laptops, NVIDIA, Gaming-PCs, Herstellerunterstützung und ob polierte Voreinstellungen wichtiger sind als Kontrolle."
what_workflow_title = "Apps, Spiele und Workflow"
what_workflow_text = "Gaming, Entwicklung, Kreativarbeit, Datenschutzpräferenzen, Windows-ähnliche Abläufe und Toleranz für Fallback-Optionen."
what_desktop_title = "Desktop-Stil"
what_desktop_text = "Präferenz für klassische Desktops, moderne Desktops, tastaturgetriebenes Tiling, Anpassbarkeit, Einfachheit und Wayland-first-Setups."
how_title = "Wie wird bewertet?"
how_text = "Jede Antwort fügt gewichtete Präferenzsignale hinzu, zum Beispiel einsteigerfreundlich, stabil, automatisiert, datenschutzorientiert, gamingtauglich, entwicklerorientiert, Rolling Release, KDE, GNOME, Tiling, Wayland und Anpassbarkeit. Distributionen und Oberflächen haben passende Profile. Die Profile mit den höchsten Werten werden als Empfehlungen angezeigt."
note = "Scores sind erklärbare Präferenztreffer, keine Garantien. Teste immer deine echte Hardware, benötigten Apps, Spiele, Peripherie und Dokumente, bevor du ein bestehendes System ersetzt."
why_title = "Warum werden diese Kriterien bewertet?"
why_text = "Viele schlechte Linux-Umstiege passieren, weil Erwartungen und Workflow-Anforderungen nicht zur gewählten Distribution passen. Einsteiger brauchen oft stabile Voreinstellungen und eine große Community, während Fortgeschrittene schnelle Updates, tiefe Kontrolle oder einen Tiling-Window-Manager bevorzugen. Die Bewertung macht diese Kompromisse vor der Installation sichtbar."
possible_title = "Mögliche Empfehlungsziele"
distros_title = "Distributionen"
interfaces_title = "Desktop-Umgebungen und Window-Manager"

