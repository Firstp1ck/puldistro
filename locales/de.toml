items_json = """
[{"category":"Office","windows":"Microsoft Office / Microsoft 365 Desktop","difficulty":"medium","summary":"Die Web-Apps funktionieren, aber die vollständigen Desktop-Versionen von Word/Excel/PowerPoint/Outlook sind unter Linux nicht nativ verfügbar. Erweiterte Excel-Makros, VBA, Access und exakte Formatierung können Windows erfordern.","alternatives":[["OnlyOffice","Beste Microsoft-Dokumentkompatibilität unter nativ wirkenden Linux-Office-Suiten."],["LibreOffice","Leistungsstarke Open-Source-Suite; hervorragend für offene Formate, manchmal unperfekt für komplexe DOCX/XLSX."],["Microsoft 365 Web","Gut, wenn du im Browser arbeiten kannst und keine vollständigen Desktop-Funktionen brauchst."],["Windows VM / Dual-Boot","Empfohlen für Access, VBA-lastiges Excel oder strikte Unternehmensvorlagen."]],"tags":["Word","Excel","PowerPoint","Outlook","VBA"]},{"category":"Kreativ","windows":"Adobe Photoshop","difficulty":"hard","summary":"Modernes Photoshop/Creative Cloud ist unter Linux kein problemloser nativer Workflow. Wine-Hacks können existieren, sind aber keine zuverlässige Empfehlung für normale Nutzer.","alternatives":[["Krita","Hervorragend für digitales Malen und Illustration."],["GIMP","Starker Foto-/Bildeditor, aber anderer Workflow und schwächere PSD-Kompatibilität."],["Photopea","Browserbasierter Photoshop-ähnlicher Editor für leichtere Arbeiten."],["Windows Dual-Boot/VM","Beste Wahl für professionelle Photoshop-abhängige Workflows."]],"tags":["Adobe","PSD","Fotobearbeitung","Design"]},{"category":"Kreativ","windows":"Adobe Illustrator / InDesign","difficulty":"hard","summary":"Professionelle Adobe-Publishing- und Vektor-Workflows lassen sich unter Linux nur schwer exakt ersetzen, besonders mit Kundendateien und Druck-Pipelines.","alternatives":[["Inkscape","Großartiger Open-Source-Vektoreditor; gut für SVG und viele Illustrations-Workflows."],["Scribus","Open-Source-Desktop-Publishing für Layout-Arbeit."],["Penpot / Figma web","Gut für Interface- und kollaborative Designarbeit."],["Windows-/macOS-Fallback","Empfohlen für Adobe-native professionelle Pipelines."]],"tags":["Adobe","Vektor","Publishing","Druck"]},{"category":"Kreativ","windows":"Adobe Premiere Pro / After Effects","difficulty":"medium","summary":"Adobe-VideoWerkzeuge sind nicht nativ, aber Linux hat ernstzunehmende Videoschnittoptionen. Motion-Graphics- und pluginlastige Workflows brauchen eventuell weiterhin Adobe.","alternatives":[["DaVinci Resolve","Professionelles Schnitt-/Color-Grading-Werkzeug für Linux; Hardware- und Codec-Setup können wichtig sein."],["Kdenlive","Freundlicher Open-Source-Videoeditor."],["Blender","Nützlich für Motion Graphics, Compositing und 3D."],["Windows-Fallback","Beste Wahl, wenn du Adobe-Plugins oder Projektaustausch brauchst."]],"tags":["Video","Motion graphics","Adobe","Resolve"]},{"category":"CAD/Engineering","windows":"AutoCAD / Revit / Inventor","difficulty":"hard","summary":"Autodesk-Desktop-Apps sind grundsätzlich Windows/macOS-first und unter Linux nicht problemlos. Professionelle Architektur-/Engineering-Nutzer sollten einen Windows-Fallback einplanen.","alternatives":[["FreeCAD","Quelloffenes parametrisches CAD; verbessert sich, ist aber kein direkter AutoCAD-/Revit-Ersatz."],["LibreCAD","2D-CAD-Option für einfacheres Zeichnen."],["Onshape","Browserbasierter CAD-Dienst, der unter Linux gut funktioniert."],["Dual-Boot / Windows-Workstation","Empfohlen für professionelle Autodesk Workflows."]],"tags":["AutoCAD","Revit","Inventor","BIM","Drafting"]},{"category":"CAD/Engineering","windows":"SolidWorks","difficulty":"hard","summary":"SolidWorks ist keine normale native Linux-App. Wine-/VM-Versuche sind für produktive Arbeit fragil und GPU-Beschleunigung kann problematisch sein.","alternatives":[["FreeCAD","Beste lokale Open-Source-Alternative für parametrisches Modellieren."],["Onshape","Browserbasierter CAD-Dienst, der unter Linux gut funktioniert."],["Fusion-/Autodesk-Web-Workflows","Kann bei manchen Workflows helfen, ersetzt SolidWorks aber nicht vollständig."],["Windows-Rechner","Zuverlässigste Wahl, wenn SolidWorks erforderlich ist."]],"tags":["Mechanisches CAD","Engineering","3D-Modellierung"]},{"category":"Gaming","windows":"Steam-Spiele ohne Anti-Cheat-Blocker","difficulty":"easy","summary":"Viele Spiele funktionieren sehr gut über Steam Proton, besonders Singleplayer- und nicht-invasive Multiplayer-Titel.","alternatives":[["Steam + Proton","Aktiviere Proton und prüfe ProtonDB für spielspezifische Hinweise."],["Heroic Games Launcher","Gut für Epic-/GOG-/Amazon-Bibliotheken."],["Lutris","Flexibler Launcher für Nicht-Steam-Spiele."],["Bottles","GUI zum Verwalten von Wine-Präfixen für Spiele und Apps."]],"tags":["Steam","Proton","Lutris","Heroic"]},{"category":"Gaming","windows":"Valorant / Fortnite / Warzone / Destiny-2-artige Anti-Cheat-Spiele","difficulty":"hard","summary":"Kernel-Anti-Cheat ist einer der größten Linux-Gaming-Blocker. Manche Spiele funktionieren, manche nicht, und der Status ändert sich mit der Zeit.","alternatives":[["ProtonDB prüfen","Prüfe das exakte Spiel und aktuelle Berichte."],["AreWeAntiCheatYet","Schnelle Anti-Cheat-Kompatibilitätsreferenz."],["Dual-Boot Windows","Beste Option, wenn diese Spiele nicht verhandelbar sind."],["Cloud-Gaming","Kann je nach Region und Dienst für manche Titel funktionieren."]],"tags":["Anti-Cheat","Vanguard","BattlEye","EAC","Ricochet"]},{"category":"Business","windows":"QuickBooks Desktop / Sage / Steuerwerkzeuge / Unternehmens-ERP-Clients","difficulty":"hard","summary":"Viele Business-Tools sind Windows-only oder nur in neueren Versionen Browserkompatibel. Lokale Datenbanken, Plugins und länder-/behördenspezifische Steuersoftware können Blocker sein.","alternatives":[["Webversion desselben Produkts","Oft der sauberste Linux-kompatible Weg, falls verfügbar."],["Odoo","Open-Source-ERP/CRM/Buchhaltung für manche Unternehmen."],["GnuCash","Gut für private oder kleine geschäftliche Buchhaltung."],["Windows-VM / Remote Desktop","Empfohlen für erforderliche alte Business-Software."]],"tags":["Buchhaltung","ERP","Steuern","Unternehmensapps"]},{"category":"Hardware","windows":"Logitech G Hub / Razer Synapse / Corsair iCUE / SteelSeries GG","difficulty":"medium","summary":"Die Geräte funktionieren oft, aber die Hersteller-Konfigurationsapps meist nicht. RGB, Makros, DPI-Profile, Firmware-Updates und Headset-Funktionen variieren.","alternatives":[["Piper","Mauskonfiguration für viele Gaming-Mäuse."],["Solaar","Großartig für Logitech-Unifying-/Bolt-Geräte."],["OpenRGB","Herstellerübergreifende RGB-Steuerung für viele Geräte."],["Windows-Fallback","Empfohlen, wenn dein Setup von Hersteller-Plugins abhängt."]],"tags":["RGB","Maus","Tastatur","Headset","Firmware"]},{"category":"Hardware","windows":"Elgato Stream Deck / Capture- und Streaming-Werkzeuge","difficulty":"medium","summary":"Streaming-Hardware kann funktionieren, aber offizielle Begleitapps sind oft Windows/macOS-first. Prüfe jedes Gerät vor dem Umstieg.","alternatives":[["OBS Studio","Hervorragende native Linux-App für Streaming und Aufnahme."],["streamdeck-ui / Boatswain","Community-Optionen zur Stream-Deck-Steuerung."],["v4l2 Werkzeuge","Nützlich für Kamera-/Capture-Fehlersuche."],["Windows-Fallback","Empfohlen, wenn dein Setup von Hersteller-Plugins abhängt."]],"tags":["OBS","Streaming","Capture","Stream Deck"]},{"category":"Musik","windows":"FL Studio / Ableton Live / kommerzielle VST-Plugins","difficulty":"medium","summary":"Linux-Audio kann hervorragend sein, aber Windows/macOS-DAWs, Plugins, iLok/DRM und AudioInterface-Tools können schwierig sein.","alternatives":[["Bitwig Studio","Professionelle DAW mit nativer Linux-Unterstützung."],["REAPER","Leistungsstarke DAW für Linux."],["Ardour","Open-Source-DAW für Aufnahme und Mixing."],["yabridge","Kann viele Windows-VST-Plugins einbinden, erfordert aber Einrichtung."]],"tags":["DAW","VST","Audio","Plugins","iLok"]},{"category":"Entwicklung","windows":"Visual Studio / .NET Desktop / SQL-Server-Werkzeuge","difficulty":"medium","summary":"Allgemeine Entwicklung ist unter Linux hervorragend, aber vollständiges Visual Studio, einige .NET-Desktop-Workloads und Microsoft-Enterprise-Tools bevorzugen weiterhin Windows.","alternatives":[["VS Code","Hervorragender plattformübergreifender Editor mit großem Erweiterungsökosystem."],["JetBrains IDEs","Starke Linux-Unterstützung für viele Sprachen."],[".NET SDK","Moderne .NET-Entwicklung funktioniert gut; prüfe Desktop-Workload-Anforderungen."],["Dev-Container","Guter Weg, Projektumgebungen zu isolieren."]],"tags":["Visual Studio",".NET","VS Code","JetBrains"]},{"category":"Kommunikation","windows":"Teams / Discord / Zoom / Slack","difficulty":"easy","summary":"Die meisten großen Kommunikationsapps haben Linux-Clients oder gute Web-Versionen, auch wenn Bildschirmfreigabe und Wayland-Support je nach App und Desktop variieren können.","alternatives":[["Native Linux-Clients","Discord, Slack, Zoom und andere haben Linux-Builds."],["Web Apps","Oft die stabilste Option für Business-Werkzeuge."],["Flatpak-Versionen","Bequeme App-Bereitstellung über Distributionen hinweg."],["GNOME-/KDE-Wayland-Sitzungen","Meist die am besten unterstützten modernen Desktop-Pfade."]],"tags":["Teams","Discord","Zoom","Slack","Wayland"]}]
"""

[glossary_data]
terms_json = """
[{"term":"Anti-Cheat","description":"Schutzsoftware gegen Cheating in Spielen. Manche Anti-Cheat-Systeme erlauben Linux nicht.","links":[{"href":"https://wiki.archlinux.org/title/Gaming#Anti-cheat_software","label":"ArchWiki: Gaming anti-cheat ↗"},{"href":"https://areweanticheatyet.com/","label":"AreWeAntiCheatYet ↗"}]},{"term":"Arch","description":"Eine Linux-Familie, bekannt für Nutzerkontrolle, häufige Updates und aktive Wartung.","links":[{"href":"https://archlinux.org/","label":"Arch Linux ↗"},{"href":"https://wiki.archlinux.org/title/Arch_Linux","label":"ArchWiki ↗"}]},{"term":"Btrfs","description":"Ein Dateisystem, das Snapshots unterstützen kann: gespeicherte Wiederherstellungspunkte.","links":[{"href":"https://wiki.archlinux.org/title/Btrfs","label":"ArchWiki: Btrfs ↗"},{"href":"https://btrfs.readthedocs.io/","label":"Btrfs docs ↗"}]},{"term":"Codecs","description":"Kleine Software-Komponenten, mit denen dein Computer Audio-/Videoformate abspielen oder erstellen kann.","links":[{"href":"https://wiki.archlinux.org/title/Codecs_and_containers","label":"ArchWiki: Codecs und containers ↗"}]},{"term":"Kommandozeile / Terminal","description":"Ein Textbefehlsfenster, mit dem du den Computer durch Eingaben steuerst.","links":[{"href":"https://wiki.archlinux.org/title/Command-line_shell","label":"ArchWiki: Command-line shell ↗"},{"href":"https://www.gnu.org/software/bash/manual/bash.html","label":"GNU Bash manuell ↗"}]},{"term":"Config Dateien","description":"Textdateien, in denen System- oder App-Einstellungen gespeichert werden.","links":[{"href":"https://wiki.archlinux.org/title/Dotfiles","label":"ArchWiki: DotDateien ↗"},{"href":"https://specifications.freedesktop.org/basedir-spec/latest/","label":"XDG base directory spec ↗"}]},{"term":"Container","description":"Isolierte Umgebungen für Apps oder Entwicklungswerkzeuge.","links":[{"href":"https://wiki.archlinux.org/title/Linux_Containers","label":"ArchWiki: Linux Containers ↗"},{"href":"https://opencontainers.org/","label":"Open Container Initiative ↗"}]},{"term":"Debian","description":"Eine Linux-Familie, bekannt für Stabilität, lange Geschichte und eine große Softwarebasis.","links":[{"href":"https://www.debian.org/","label":"Debian ↗"},{"href":"https://www.debian.org/doc/","label":"Debian Dokumentation ↗"}]},{"term":"Desktop-Umgebung","description":"Die vollständige grafische Oberfläche: Leisten, Menüs, Einstellungs-App, Dateimanager und Fensterverhalten.","links":[{"href":"https://wiki.archlinux.org/title/Desktop_environment","label":"ArchWiki: Desktop environment ↗"}]},{"term":"Distro","description":"Kurz für Linux-Distribution: ein vollständiges Linux-basiertes Betriebssystem, das du installieren kannst.","links":[{"href":"https://wiki.archlinux.org/title/Linux","label":"ArchWiki: Linux ↗"},{"href":"https://distrowatch.com/","label":"DistroWatch ↗"}]},{"term":"Dual-Boot","description":"Zwei Betriebssysteme, zum Beispiel Windows und Linux, parallel installiert halten und beim Start auswählen.","links":[{"href":"https://wiki.archlinux.org/title/Dual_boot_with_Windows","label":"ArchWiki: Dual-Boot mit Windows ↗"}]},{"term":"Treiber","description":"Software, über die das Betriebssystem mit Hardware wie Grafikkarten, WLAN und Druckern spricht.","links":[{"href":"https://wiki.archlinux.org/title/Kernel_module","label":"ArchWiki: Kernel module ↗"},{"href":"https://docs.kernel.org/driver-api/index.html","label":"Linux kernel Treiber docs ↗"}]},{"term":"Firmware","description":"Kleine eingebaute Software in Hardware-Geräten.","links":[{"href":"https://wiki.archlinux.org/title/Linux_firmware","label":"ArchWiki: Linux Firmware ↗"},{"href":"https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/","label":"Linux Firmware repository ↗"}]},{"term":"Flatpak","description":"Ein App-Format, das auf vielen Linux-Systemen funktioniert und oft über grafische App-Stores installiert wird.","links":[{"href":"https://docs.flatpak.org/","label":"Flatpak docs ↗"},{"href":"https://wiki.archlinux.org/title/Flatpak","label":"ArchWiki: Flatpak ↗"}]},{"term":"GNOME","description":"Eine moderne, einfache Linux-Desktop-Oberfläche mit fokussiertem Workflow.","links":[{"href":"https://www.gnome.org/","label":"GNOME ↗"},{"href":"https://wiki.archlinux.org/title/GNOME","label":"ArchWiki: GNOME ↗"}]},{"term":"GPU","description":"Graphics Processing Unit: der Chip oder die Karte, die Grafik und Spiele berechnet.","links":[{"href":"https://wiki.archlinux.org/title/Hardware_video_acceleration","label":"ArchWiki: Hardware video acceleration ↗"},{"href":"https://docs.mesa3d.org/","label":"Linux graphics stack ↗"}]},{"term":"Homelab","description":"Ein persönliches Heimserver-Setup zum Lernen, Speichern, für Medien, Netzwerk oder Experimente.","links":[{"href":"https://wiki.archlinux.org/title/Category:Server","label":"ArchWiki: Server ↗"},{"href":"https://www.debian.org/doc/manuals/debian-handbook/sect.server-services.en.html","label":"Debian Server docs ↗"}]},{"term":"Unveränderlich","description":"Ein Systemdesign, bei dem zentrale Systemdateien geschützt sind und Updates leichter rückgängig gemacht werden können.","links":[{"href":"https://fedoraproject.org/atomic-desktops/","label":"Fedora Atomic Desktops ↗"},{"href":"https://microos.opensuse.org/","label":"openSUSE MicroOS ↗"}]},{"term":"Kernel","description":"Der Kern des Betriebssystems, der direkt mit der Hardware spricht.","links":[{"href":"https://www.kernel.org/","label":"Linux kernel ↗"},{"href":"https://wiki.archlinux.org/title/Kernel","label":"ArchWiki: Kernel ↗"}]},{"term":"KDE Plasma","description":"Eine stark anpassbare Linux-Desktop-Oberfläche mit traditionellem, Windows-ähnlichem Layout.","links":[{"href":"https://kde.org/plasma-desktop/","label":"KDE Plasma ↗"},{"href":"https://wiki.archlinux.org/title/KDE","label":"ArchWiki: KDE ↗"}]},{"term":"Mesa","description":"Open-Source-Grafiksoftware, die viele Linux-Systeme nutzen, besonders für AMD- und Intel-Grafik.","links":[{"href":"https://docs.mesa3d.org/","label":"Mesa docs ↗"},{"href":"https://wiki.archlinux.org/title/Mesa","label":"ArchWiki: Mesa ↗"}]},{"term":"NVIDIA","description":"Ein Grafikkartenhersteller. Die Linux-Treibereinrichtung kann empfindlicher sein als bei AMD oder Intel.","links":[{"href":"https://wiki.archlinux.org/title/NVIDIA","label":"ArchWiki: NVIDIA ↗"},{"href":"https://www.nvidia.com/en-us/drivers/unix/","label":"NVIDIA Unix Treiber ↗"}]},{"term":"Rollback","description":"Zu einem früheren funktionierenden Zustand zurückkehren, nachdem ein Update oder eine Änderung etwas beschädigt hat.","links":[{"href":"https://wiki.archlinux.org/title/System_backup","label":"ArchWiki: System backup ↗"},{"href":"https://wiki.archlinux.org/title/Snapper","label":"ArchWiki: Snapper ↗"}]},{"term":"Rolling Release","description":"Ein Update-Stil, bei dem Software laufend erscheint statt in großen Versionssprüngen.","links":[{"href":"https://wiki.archlinux.org/title/System_maintenance","label":"ArchWiki: System maintenance ↗"},{"href":"https://archlinux.org/releng/releases/","label":"Arch Linux release model ↗"}]},{"term":"Sandbox-App","description":"Eine vom Rest des Systems isolierte App, um Risiko zu senken und Abhängigkeitskonflikte zu vermeiden.","links":[{"href":"https://docs.flatpak.org/en/latest/sandbox-permissions.html","label":"Flatpak sandbox permissions ↗"},{"href":"https://wiki.archlinux.org/title/Firejail","label":"ArchWiki: Firejail ↗"}]},{"term":"Server","description":"Ein Computer, der hauptsächlich Dienste bereitstellt, etwa Dateien, Websites, Medien oder Automatisierung.","links":[{"href":"https://wiki.archlinux.org/title/Category:Server","label":"ArchWiki: Server category ↗"},{"href":"https://www.debian.org/doc/manuals/debian-handbook/sect.server-services.en.html","label":"Debian handbook: Server services ↗"}]},{"term":"Snap","description":"Ein App-Paketformat, das mit Ubuntu/Canonical verbunden ist.","links":[{"href":"https://snapcraft.io/docs","label":"Snapcraft docs ↗"},{"href":"https://wiki.archlinux.org/title/Snap","label":"ArchWiki: Snap ↗"}]},{"term":"Snapshot","description":"Gespeicherte Wiederherstellungspunkte von Systemdateien, nützlich zum Rückgängigmachen von Änderungen.","links":[{"href":"https://wiki.archlinux.org/title/Btrfs#Snapshots","label":"ArchWiki: Btrfs snapshots ↗"},{"href":"https://wiki.archlinux.org/title/Snapper","label":"ArchWiki: Snapper ↗"}]},{"term":"Quellcode","description":"Die menschenlesbaren Anweisungen, die Programmierer schreiben, bevor Software gebaut wird.","links":[{"href":"https://www.gnu.org/philosophy/free-sw.html","label":"GNU: free Software ↗"},{"href":"https://git-scm.com/doc","label":"Git Dokumentation ↗"}]},{"term":"Stabil","description":"Priorisiert Zuverlässigkeit und weniger Überraschungen, meist durch langsamere Softwareänderungen.","links":[{"href":"https://www.debian.org/releases/","label":"Debian releases ↗"},{"href":"https://wiki.debian.org/DebianStable","label":"Debian stabil ↗"}]},{"term":"Tiling Window-Manager","description":"Ein Fensterlayout beziehungsweise Window-Manager, bei dem Fenster automatisch ohne Überlappung angeordnet werden, oft per Tastaturkürzel gesteuert.","links":[{"href":"https://wiki.archlinux.org/title/Window_manager","label":"ArchWiki: Window manager ↗"},{"href":"https://i3wm.org/docs/userguide.html","label":"i3 user guide ↗"}]},{"term":"Virtuelle Maschine / VM","description":"Ein Computer, der innerhalb deines aktuellen Computers simuliert wird, oft um ein anderes Betriebssystem auszuführen.","links":[{"href":"https://wiki.archlinux.org/title/Virtualization","label":"ArchWiki: Virtualization ↗"},{"href":"https://www.qemu.org/docs/master/","label":"QEMU Dokumentation ↗"}]},{"term":"Wayland","description":"Ein modernes Linux-Anzeigesystem, das steuert, wie Apps Fenster zeichnen und Eingaben erhalten.","links":[{"href":"https://wayland.freedesktop.org/","label":"Wayland ↗"},{"href":"https://wiki.archlinux.org/title/Wayland","label":"ArchWiki: Wayland ↗"}]},{"term":"Xfce","description":"Eine leichtgewichtige traditionelle Linux-Desktop-Oberfläche, oft gut für ältere Computer.","links":[{"href":"https://www.xfce.org/","label":"Xfce ↗"},{"href":"https://wiki.archlinux.org/title/Xfce","label":"ArchWiki: Xfce ↗"}]},{"term":"ZFS","description":"Ein fortgeschrittenes Speichersystem mit starken Datenverwaltungsfunktionen.","links":[{"href":"https://openzfs.github.io/openzfs-docs/","label":"OpenZFS docs ↗"},{"href":"https://wiki.archlinux.org/title/ZFS","label":"ArchWiki: ZFS ↗"}]}]
