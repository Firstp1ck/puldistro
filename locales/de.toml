chirm kachelt.","i3":"Ein tastaturfokussierter Tiling-Window-Manager, bekannt für Einfachheit und Dokumentation.","immutable":"Ein Systemdesign, bei dem zentrale Systemdateien geschützt sind und Updates leichter rückgängig gemacht werden können.","installer":"Das Einrichtungsprogramm, das ein Betriebssystem auf deinem Computer installiert.","kernel":"Der Kern des Betriebssystems, der direkt mit der Hardware spricht.","KDE Plasma":"Eine stark anpassbare Linux-Desktop-Oberfläche mit traditionellem, Windows-ähnlichem Layout.","Linux":"Eine Open-Source-Betriebssystemfamilie für Desktops, Server, Smartphones und eingebettete Geräte.","Mesa":"Open-Source-Grafiksoftware, die viele Linux-Systeme nutzen, besonders für AMD- und Intel-Grafik.","NVIDIA":"Ein Grafikkartenhersteller. Die Linux-Treibereinrichtung kann empfindlicher sein als bei AMD oder Intel.","ProtonDB":"Eine Community-Website mit Berichten dazu, wie gut Windows-Spiele über Steam Proton unter Linux laufen.","rollback":"Zu einem früheren funktionierenden Zustand zurückkehren, nachdem ein Update oder eine Änderung etwas beschädigt hat.","rolling":"Ein Update-Stil, bei dem Software laufend erscheint statt in großen Versionssprüngen.","sandboxed":"Vom Rest des Systems isoliert, um Risiko zu senken und Abhängigkeitskonflikte zu vermeiden.","server":"Ein Computer, der hauptsächlich Dienste bereitstellt, etwa Dateien, Websites, Medien oder Automatisierung.","Snap":"Ein App-Paketformat, das mit Ubuntu/Canonical verbunden ist.","snapshots":"Gespeicherte Wiederherstellungspunkte von Systemdateien, nützlich zum Rückgängigmachen von Änderungen.","source code":"Die menschenlesbaren Anweisungen, die Programmierer schreiben, bevor Software gebaut wird.","stable":"Priorisiert Zuverlässigkeit und weniger Überraschungen, meist durch langsamere Softwareänderungen.","Sway":"Eine tastaturfokussierte Tiling-Oberfläche für Wayland.","terminal":"Ein Textbefehlsfenster, mit dem du den Computer durch Eingaben steuerst.","tiling":"Ein Fensterlayout, bei dem Fenster automatisch ohne Überlappung angeordnet werden.","VM":"Virtuelle Maschine: ein Computer, der innerhalb deines aktuellen Computers simuliert wird, oft für ein anderes Betriebssystem.","Wayland":"Ein modernes Linux-Anzeigesystem, das steuert, wie Apps Fenster zeichnen und Eingaben erhalten.","Xfce":"Eine leichtgewichtige traditionelle Linux-Desktop-Oberfläche, oft gut für ältere Computer.","ZFS":"Ein fortgeschrittenes Speichersystem mit starken Datenverwaltungsfunktionen."}
"""

