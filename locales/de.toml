[privacy]
title = "Datenschutz | Puldistro"
eyebrow = "Datenschutz"
heading = "Datenschutzfreundlich konzipiert."
intro = "Puldistro führt das Quiz in deinem Browser aus und benötigt kein Konto."
data_title = "Datenerhebung"
data_1 = "Quiz-Antworten bleiben in deinem Browser, außer du drückst auf der Ergebnisseite ausdrücklich den Button zum anonymen Teilen."
data_2 = "Wenn du anonym teilst, speichert Puldistro deine ausgewählten Antworten, Bewertungssignale, Sprache und Empfehlungsergebnisse in einer Cloudflare-D1-Datenbank. Puldistro speichert zu dieser Einsendung keinen Namen, keine E-Mail-Adresse, keine IP-Adresse, keine Cookies und keinen Browser-Fingerabdruck."
data_3 = "In diesen Dateien sind keine Drittanbieter-Analyse- oder Tracking-Skripte enthalten."
external_title = "Externe Links"
external_text = "Die Website verlinkt auf Drittprojekte wie Linux-Distributionen, App-Websites, Dokumentationen und Kompatibilitätsdatenbanken. Diese Websites haben eigene Datenschutzrichtlinien."
storage_title = "Lokaler Speicher"
storage_text = "Die Website speichert deine Hell-/Dunkel-Designauswahl und Spracheinstellung im lokalen Speicher, damit diese Einstellungen seitenübergreifend erhalten bleiben. Quiz-Antworten werden nach dem Aktualisieren nicht lokal gespeichert; ein Neustart des Quiz setzt die Antworten zurück."

