terms_json = """
[{"term":"Anti-cheat","description":"Schutzsoftware in Spielen, die Cheating verhindern soll. Einige Anti-Cheat-Systeme erlauben Linux nicht.","links":[{"href":"https://wiki.archlinux.org/title/Gaming#Anti-cheat_software","label":"ArchWiki: Gaming anti-cheat ↗"},{"href":"https://areweanticheatyet.com/","label":"AreWeAntiCheatYet ↗"}]},{"term":"Arch","description":"Eine Linux-Familie, bekannt für Nutzerkontrolle, häufige Updates und aktive Wartung durch den Nutzer.","links":[{"href":"https://archlinux.org/","label":"Arch Linux ↗"},{"href":"https://wiki.archlinux.org/title/Arch_Linux","label":"ArchWiki ↗"}]},{"term":"Btrfs","description":"Ein Speicherformat, das Snapshots unterstützen kann – gespeicherte Wiederherstellungspunkte.","links":[{"href":"https://wiki.archlinux.org/title/Btrfs","label":"ArchWiki: Btrfs ↗"},{"href":"https://btrfs.readthedocs.io/","label":"Btrfs docs ↗"}]},{"term":"Codecs","description":"Kleine Softwarekomponenten, mit denen dein Computer Audio-/Videoformate abspielen oder erstellen kann.","links":[{"href":"https://wiki.archlinux.org/title/Codecs_and_containers","label":"ArchWiki: Codecs und containers ↗"}]},{"term":"Command line / terminal","description":"Ein Textfenster, in dem du den Computer durch eingegebene Befehle steuerst.","links":[{"href":"https://wiki.archlinux.org/title/Command-line_shell","label":"ArchWiki: Command-line shell ↗"},{"href":"https://www.gnu.org/software/bash/manual/bash.html","label":"GNU Bash manuell ↗"}]},{"term":"Config Dateien","description":"Textdateien, in denen System- oder App-Einstellungen gespeichert werden.","links":[{"href":"https://wiki.archlinux.org/title/Dotfiles","label":"ArchWiki: DotDateien ↗"},{"href":"https://specifications.freedesktop.org/basedir-spec/latest/","label":"XDG base directory spec ↗"}]},{"term":"Containers","description":"Isolierte Umgebungen für Apps oder Entwicklungswerkzeuge.","links":[{"href":"https://wiki.archlinux.org/title/Linux_Containers","label":"ArchWiki: Linux Containers ↗"},{"href":"https://opencontainers.org/","label":"Open Container Initiative ↗"}]},{"term":"Debian","description":"Eine Linux-Familie, bekannt für Stabilität, lange Geschichte und eine große Softwarebasis.","links":[{"href":"https://www.debian.org/","label":"Debian ↗"},{"href":"https://www.debian.org/doc/","label":"Debian Dokumentation ↗"}]},{"term":"Desktop-Umgebung","description":"The full grafisch Interface: panels, menus, Einstellungen App, file manager, und window behavior.","links":[{"href":"https://wiki.archlinux.org/title/Desktop_environment","label":"ArchWiki: Desktop environment ↗"}]},{"term":"Distro","description":"Kurz für Linux-Distribution: ein vollständiges Linux-basiertes Betriebssystem, das du installieren kannst.","links":[{"href":"https://wiki.archlinux.org/title/Linux","label":"ArchWiki: Linux ↗"},{"href":"https://distrowatch.com/","label":"DistroWatch ↗"}]},{"term":"Dual-Boot","description":"Keeping two operating Systeme installed, such as Windows und Linux, und choosing one when Computer starts.","links":[{"href":"https://wiki.archlinux.org/title/Dual_boot_with_Windows","label":"ArchWiki: Dual-Boot mit Windows ↗"}]},{"term":"Driver","description":"Software, mit der das Betriebssystem mit Hardware wie Grafikkarten, WLAN und Druckern kommuniziert.","links":[{"href":"https://wiki.archlinux.org/title/Kernel_module","label":"ArchWiki: Kernel module ↗"},{"href":"https://docs.kernel.org/driver-api/index.html","label":"Linux kernel Treiber docs ↗"}]},{"term":"Firmware","description":"Kleine eingebaute Software in Hardwaregeräten.","links":[{"href":"https://wiki.archlinux.org/title/Linux_firmware","label":"ArchWiki: Linux Firmware ↗"},{"href":"https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/","label":"Linux Firmware repository ↗"}]},{"term":"Flatpak","description":"Ein App-Format, das auf vielen Linux-Systemen funktioniert und oft über grafische App-Stores installiert wird.","links":[{"href":"https://docs.flatpak.org/","label":"Flatpak docs ↗"},{"href":"https://wiki.archlinux.org/title/Flatpak","label":"ArchWiki: Flatpak ↗"}]},{"term":"GNOME","description":"Eine moderne, einfache Linux-Desktop-Oberfläche mit fokussiertem Workflow.","links":[{"href":"https://www.gnome.org/","label":"GNOME ↗"},{"href":"https://wiki.archlinux.org/title/GNOME","label":"ArchWiki: GNOME ↗"}]},{"term":"GPU","description":"Graphics Processing Unit: der Chip oder die Karte für Grafik und Spiele.","links":[{"href":"https://wiki.archlinux.org/title/Hardware_video_acceleration","label":"ArchWiki: Hardware video acceleration ↗"},{"href":"https://docs.mesa3d.org/","label":"Linux graphics stack ↗"}]},{"term":"Homelab","description":"Ein persönliches Heimserver-Setup zum Lernen, für Speicher, Medien, Netzwerk oder Experimente.","links":[{"href":"https://wiki.archlinux.org/title/Category:Server","label":"ArchWiki: Server ↗"},{"href":"https://www.debian.org/doc/manuals/debian-handbook/sect.server-services.en.html","label":"Debian Server docs ↗"}]},{"term":"Immutable","description":"Ein Systemdesign, bei dem zentrale Systemdateien geschützt sind und Updates leichter rückgängig gemacht werden können.","links":[{"href":"https://fedoraproject.org/atomic-desktops/","label":"Fedora Atomic Desktops ↗"},{"href":"https://microos.opensuse.org/","label":"openSUSE MicroOS ↗"}]},{"term":"Kernel","description":"Der Kern des BetriebsSysteme, der direkt mit der Hardware spricht.","links":[{"href":"https://www.kernel.org/","label":"Linux kernel ↗"},{"href":"https://wiki.archlinux.org/title/Kernel","label":"ArchWiki: Kernel ↗"}]},{"term":"KDE Plasma","description":"Eine stark anpassbare Linux-Desktop-Oberfläche mit traditionellem, Windows-ähnlichem Layout.","links":[{"href":"https://kde.org/plasma-desktop/","label":"KDE Plasma ↗"},{"href":"https://wiki.archlinux.org/title/KDE","label":"ArchWiki: KDE ↗"}]},{"term":"Mesa","description":"Open-Source-Grafiksoftware, die viele Linux-Systeme nutzen, besonders für AMD- und Intel-Grafik.","links":[{"href":"https://docs.mesa3d.org/","label":"Mesa docs ↗"},{"href":"https://wiki.archlinux.org/title/Mesa","label":"ArchWiki: Mesa ↗"}]},{"term":"NVIDIA","description":"Ein Grafikkartenhersteller. Die Linux-Treibereinrichtung kann empfindlicher sein als bei AMD oder Intel.","links":[{"href":"https://wiki.archlinux.org/title/NVIDIA","label":"ArchWiki: NVIDIA ↗"},{"href":"https://www.nvidia.com/en-us/drivers/unix/","label":"NVIDIA Unix Treiber ↗"}]},{"term":"Rollback","description":"Zu einem früheren funktionierenden Zustand zurückkehren, nachdem ein Update oder eine Änderung etwas beschädigt hat.","links":[{"href":"https://wiki.archlinux.org/title/System_backup","label":"ArchWiki: System backup ↗"},{"href":"https://wiki.archlinux.org/title/Snapper","label":"ArchWiki: Snapper ↗"}]},{"term":"Rolling release","description":"Ein Update-Stil, bei dem Software kontinuierlich eintrifft statt in großen Versionssprüngen.","links":[{"href":"https://wiki.archlinux.org/title/System_maintenance","label":"ArchWiki: System maintenance ↗"},{"href":"https://archlinux.org/releng/releases/","label":"Arch Linux release model ↗"}]},{"term":"Sandboxed App","description":"An App isolated von rest von system zu reduce risk und avoid dependency conflicts.","links":[{"href":"https://docs.flatpak.org/en/latest/sandbox-permissions.html","label":"Flatpak sandbox permissions ↗"},{"href":"https://wiki.archlinux.org/title/Firejail","label":"ArchWiki: Firejail ↗"}]},{"term":"Server","description":"Ein Computer, der hauptsächlich Dienste bereitstellt, zum Beispiel Dateien, Websites, Medien oder Automatisierung.","links":[{"href":"https://wiki.archlinux.org/title/Category:Server","label":"ArchWiki: Server category ↗"},{"href":"https://www.debian.org/doc/manuals/debian-handbook/sect.server-services.en.html","label":"Debian handbook: Server services ↗"}]},{"term":"Snap","description":"Ein App-Paketformat, das mit Ubuntu/Canonical verbunden ist.","links":[{"href":"https://snapcraft.io/docs","label":"Snapcraft docs ↗"},{"href":"https://wiki.archlinux.org/title/Snap","label":"ArchWiki: Snap ↗"}]},{"term":"Snapshot","description":"Ein gespeicherter Wiederherstellungspunkt von Systemdateien, nützlich zum Rückgängigmachen von Änderungen.","links":[{"href":"https://wiki.archlinux.org/title/Btrfs#Snapshots","label":"ArchWiki: Btrfs snapshots ↗"},{"href":"https://wiki.archlinux.org/title/Snapper","label":"ArchWiki: Snapper ↗"}]},{"term":"Source code","description":"Die menschenlesbaren Anweisungen, die Programmierer schreiben, bevor Software gebaut wird.","links":[{"href":"https://www.gnu.org/philosophy/free-sw.html","label":"GNU: free Software ↗"},{"href":"https://git-scm.com/doc","label":"Git Dokumentation ↗"}]},{"term":"Stabil","description":"Prioritizes reliability und fewer surprises, usually by changing Software more slowly.","links":[{"href":"https://www.debian.org/releases/","label":"Debian releases ↗"},{"href":"https://wiki.debian.org/DebianStable","label":"Debian stabil ↗"}]},{"term":"Tiling Window-Manager","description":"A window layout where windows automatically arrange themselves ohne overlapping, often Kontrolleled by keyboard shortcuts.","links":[{"href":"https://wiki.archlinux.org/title/Window_manager","label":"ArchWiki: Window manager ↗"},{"href":"https://i3wm.org/docs/userguide.html","label":"i3 user guide ↗"}]},{"term":"Virtuelle Maschine / VM","description":"A Computer simulated inside your current Computer, often used zu run another operating system.","links":[{"href":"https://wiki.archlinux.org/title/Virtualization","label":"ArchWiki: Virtualization ↗"},{"href":"https://www.qemu.org/docs/master/","label":"QEMU Dokumentation ↗"}]},{"term":"Wayland","description":"Ein modernes Linux-Anzeigesystem, das steuert, wie Apps Fenster zeichnen und Eingaben erhalten.","links":[{"href":"https://wayland.freedesktop.org/","label":"Wayland ↗"},{"href":"https://wiki.archlinux.org/title/Wayland","label":"ArchWiki: Wayland ↗"}]},{"term":"Xfce","description":"Eine leichtgewichtige traditionelle Linux-Desktop-Oberfläche, oft gut für ältere Computer.","links":[{"href":"https://www.xfce.org/","label":"Xfce ↗"},{"href":"https://wiki.archlinux.org/title/Xfce","label":"ArchWiki: Xfce ↗"}]},{"term":"ZFS","description":"Ein fortgeschrittenes Speichersystem mit starken Datenverwaltungsfunktionen.","links":[{"href":"https://openzfs.github.io/openzfs-docs/","label":"OpenZFS docs ↗"},{"href":"https://wiki.archlinux.org/title/ZFS","label":"ArchWiki: ZFS ↗"}]}]
