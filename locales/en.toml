{"anti-cheat":"Game protection software used to stop cheating. Some anti-cheat systems do not allow Linux.","Arch":"A Linux family known for user control, frequent updates, and hands-on maintenance.","Btrfs":"A storage format that can support snapshots, which are saved restore points.","Cinnamon":"A traditional desktop interface that feels familiar to many Windows users.","codecs":"Small software components that let your computer play or create audio/video formats.","compile":"Build software from source code instead of installing a ready-made app package.","config files":"Text files that store system or app settings.","containers":"Isolated environments for apps or development tools.","Debian":"A Linux family known for stability, long history, and a large software base.","desktop environment":"The full graphical interface: panels, menus, settings app, file manager, and window behavior.","distro":"Short for Linux distribution: a complete Linux-based operating system you can install.","dual-boot":"Keeping two operating systems installed, such as Windows and Linux, and choosing one when the computer starts.","driver":"Software that lets the operating system talk to hardware like graphics cards, Wi‑Fi, and printers.","firmware":"Small built-in software inside hardware devices.","Flatpak":"An app format that works across many Linux systems, often installed through graphical app stores.","GNOME":"A modern, simple Linux desktop interface with a focused workflow.","GPU":"Graphics Processing Unit: the chip/card that handles graphics and games.","headless":"A computer used without a monitor, keyboard, or regular graphical desktop.","homelab":"A personal home server setup used for learning, storage, media, networking, or experiments.","Hyprland":"A keyboard-focused interface that automatically tiles windows on screen.","i3":"A keyboard-focused tiling window manager known for simplicity and documentation.","immutable":"A system design where core system files are protected, making updates easier to undo.","installer":"The setup program that installs the operating system onto your computer.","kernel":"The core of the operating system that talks directly to hardware.","KDE Plasma":"A highly customizable Linux desktop interface with a traditional Windows-like layout.","Linux":"An open-source operating system family used on desktops, servers, phones, and embedded devices.","Mesa":"Open-source graphics software used by many Linux systems, especially for AMD and Intel graphics.","NVIDIA":"A graphics-card maker. Its Linux driver setup can be more sensitive than AMD or Intel.","ProtonDB":"A community website that reports how well Windows games work on Linux through Steam Proton.","rollback":"Going back to an earlier working state after an update or change breaks something.","rolling":"An update style where software arrives continuously instead of in big version releases.","sandboxed":"Isolated from the rest of the system to reduce risk and avoid dependency conflicts.","server":"A computer mainly used to provide services, such as files, websites, media, or automation.","Snap":"An app package format associated with Ubuntu/Canonical.","snapshots":"Saved restore points of system files, useful for undoing changes.","source code":"The human-readable instructions programmers write before software is built.","stable":"Prioritizes reliability and fewer surprises, usually by changing software more slowly.","Sway":"A keyboard-focused tiling interface for Wayland.","terminal":"A text command window used to control the computer by typing commands.","tiling":"A window layout style where windows automatically arrange themselves without overlapping.","VM":"Virtual machine: a computer simulated inside your current computer, often used to run another operating system.","Wayland":"A modern Linux display system that controls how apps draw windows and receive input.","Xfce":"A lightweight traditional Linux desktop interface, often good for older computers.","ZFS":"An 