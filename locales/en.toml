[{"category":"Office","windows":"Microsoft Office / Microsoft 365 desktop","difficulty":"medium","summary":"The web apps work, but full desktop Word/Excel/PowerPoint/Outlook are not native on Linux. Advanced Excel macros, VBA, Access, and exact formatting can require Windows.","alternatives":[["OnlyOffice","Best for Microsoft document compatibility among native-feeling Linux office suites."],["LibreOffice","Powerful open-source suite; excellent for open formats, sometimes imperfect for complex DOCX/XLSX."],["Microsoft 365 Web","Good if you can work in the browser and do not need full desktop features."],["Windows VM / dual boot","Recommended for Access, VBA-heavy Excel, or strict corporate templates."]],"tags":["Word","Excel","PowerPoint","Outlook","VBA"]},{"category":"Creative","windows":"Adobe Photoshop","difficulty":"hard","summary":"Modern Photoshop/Creative Cloud is not a painless native Linux workflow. Wine hacks may exist, but are not a reliable recommendation for normal users.","alternatives":[["Krita","Excellent for digital painting and illustration."],["GIMP","Strong photo/image editor, but different workflow and weaker PSD compatibility."],["Photopea","Browser-based Photoshop-like editor for lighter work."],["Windows dual boot/VM","Best for professional Photoshop-dependent workflows."]],"tags":["Adobe","PSD","Photo editing","Design"]},{"category":"Creative","windows":"Adobe Illustrator / InDesign","difficulty":"hard","summary":"Professional Adobe publishing/vector workflows are difficult to replace exactly on Linux, especially with client files and print pipelines.","alternatives":[["Inkscape","Great open-source vector editor; good for SVG and many illustration workflows."],["Scribus","Open-source desktop publishing for layout work."],["Penpot / Figma web","Good for interface and collaborative design work."],["Windows/macOS fallback","Recommended for Adobe-native professional pipelines."]],"tags":["Adobe","Vector","Publishing","Print"]},{"category":"Creative","windows":"Adobe Premiere Pro / After Effects","difficulty":"medium","summary":"Adobe video tools are not native, but Linux has serious video editing options. Motion graphics and plugin-heavy workflows may still need Adobe.","alternatives":[["DaVinci Resolve","Professional editor/color tool available on Linux; hardware/codec setup can matter."],["Kdenlive","Friendly open-source video editor."],["Blender","Useful for motion graphics, compositing, and 3D."],["Windows fallback","Best if you rely on Adobe plugins or project exchange."]],"tags":["Video","Motion graphics","Adobe","Resolve"]},{"category":"CAD/Engineering","windows":"AutoCAD / Revit / Inventor","difficulty":"hard","summary":"Autodesk desktop apps are generally Windows/macOS-first and not painless on Linux. Professional architecture/engineering users should plan a Windows fallback.","alternatives":[["FreeCAD","Open-source parametric CAD; improving but not a drop-in AutoCAD/Revit replacement."],["LibreCAD","2D CAD option for simpler drafting."],["Onshape","Browser-based CAD that works well on Linux."],["Dual boot / Windows workstation","Recommended for professional Autodesk workflows."]],"tags":["AutoCAD","Revit","Inventor","BIM","Drafting"]},{"category":"CAD/Engineering","windows":"SolidWorks","difficulty":"hard","summary":"SolidWorks is not a normal native Linux app. Wine/VM attempts are fragile for production work and GPU acceleration can be a problem.","alternatives":[["FreeCAD","Best open-source local alternative for parametric modeling."],["Onshape","Strong browser CAD alternative, especially for collaboration."],["Fusion/Autodesk web workflows","May help for some workflows, but not full SolidWorks replacement."],["Windows machine","Most reliable choice if SolidWorks is required."]],"tags":["Mechanical CAD","Engineering","3D modeling"]},{"category":"Gaming","windows":"Steam games without anti-cheat blockers","difficulty":"easy","summary":"Many games work very well through Steam Proton, especially single-player and non-invasive multiplayer titles.","alternatives":[["Steam + Proton","Enable Proton and check ProtonDB for game-specific notes."],["Heroic Games Launcher","Good for Epic/GOG/Amazon libraries."],["Lutris","Flexible launcher for non-Steam games."],["Bottles","GUI for managing Wine prefixes for games/apps."]],"tags":["Steam","Proton","Lutris","Heroic"]},{"category":"Gaming","windows":"Valorant / Fortnite / Warzone / Destiny 2-style anti-cheat games","difficulty":"hard","summary":"Kernel anti-cheat is one of the biggest Linux gaming blockers. Some games work, some do not, and status changes over time.","alternatives":[["Check ProtonDB","Verify the exact game and recent reports."],["AreWeAntiCheatYet","Quick anti-cheat compatibility reference."],["Dual boot Windows","Best option if these games are non-negotiable."],["Cloud gaming","May work for some titles depending on region/service."]],"tags":["Anti-cheat","Vanguard","BattlEye","EAC","Ricochet"]},{"category":"Business","windows":"QuickBooks Desktop / Sage / tax tools / company ERP clients","difficulty":"hard","summary":"Many business tools are Windows-only or browser-compatible only in newer versions. Local databases, plugins, and government/country-specific tax software can be blockers.","alternatives":[["Web version of the same product","Often the cleanest Linux-compatible route if available."],["Odoo","Open-source ERP/CRM/accounting option for some businesses."],["GnuCash","Good personal/small-business accounting alternative."],["Windows VM / remote desktop","Recommended for required legacy business software."]],"tags":["Accounting","ERP","Tax","Company apps"]},{"category":"Hardware","windows":"Logitech G Hub / Razer Synapse / Corsair iCUE / SteelSeries GG","difficulty":"medium","summary":"The devices often work, but vendor configuration apps usually do not. RGB, macros, DPI profiles, firmware updates, and headset features vary.","alternatives":[["Piper","Mouse configuration for many gaming mice."],["Solaar","Great for Logitech Unifying/Bolt devices."],["OpenRGB","Cross-vendor RGB control for many devices."],["Windows fallback","Useful for firmware updates or vendor-only features."]],"tags":["RGB","Mouse","Keyboard","Headset","Firmware"]},{"category":"Hardware","windows":"Elgato Stream Deck / capture / streaming utilities","difficulty":"medium","summary":"Streaming hardware can work, but official companion apps are often Windows/macOS-first. Check each device before switching.","alternatives":[["OBS Studio","Excellent native Linux streaming/recording app."],["streamdeck-ui / Boatswain","Community Stream Deck control options."],["v4l2 tools","Useful for camera/capture troubleshooting."],["Windows fallback","Recommended if your setup depends on vendor plugins."]],"tags":["OBS","Streaming","Capture","Stream Deck"]},{"category":"Music","windows":"FL Studio / Ableton Live / commercial VST plugins","difficulty":"medium","summary":"Linux audio can be excellent, but Windows/macOS DAWs, plugins, iLok/DRM, and audio interface utilities can be difficult.","alternatives":[["Bitwig Studio","Professional DAW with native Linux support."],["REAPER","Powerful DAW available on Linux."],["Ardour","Open-source DAW for recording/mixing."],["yabridge","Can bridge many Windows VST plugins, but requires setup."]],"tags":["DAW","VST","Audio","Plugins","iLok"]},{"category":"Dev","windows":"Visual Studio / .NET desktop / SQL Server tooling","difficulty":"medium","summary":"General development is excellent on Linux, but full Visual Studio, some .NET desktop workloads, and Microsoft enterprise tooling may still prefer Windows.","alternatives":[["VS Code","Excellent cross-platform editor with huge extension ecosystem."],["JetBrains IDEs","Strong Linux support across many languages."],[".NET SDK","Modern .NET development works well; check desktop workload needs."],["Dev containers","Good way to isolate project environments."]],"tags":["Visual Studio",".NET","VS Code","JetBrains"]},{"category":"Communication","windows":"Teams / Discord / Zoom / Slack","difficulty":"easy","summary":"Most mainstream communication apps have Linux clients or good web versions, though screen sharing and Wayland support can vary by app and desktop.","alternatives":[["Native Linux clients","Discord, Slack, Zoom, and others have Linux builds."],["Web apps","Often the most stable option for business tools."],["Flatpak versions","Convenient app delivery across distros."],["GNOME/KDE Wayland sessions","Usually best-supported modern desktop paths."]],"tags":["Teams","Discord","Zoom","Slack","Wayland"]}]
"""

[glossary_data]
terms_json = """
[{"term":"Anti-cheat","description":"Game protection software used to stop cheating. Some anti-cheat systems do not allow Linux.","links":[{"href":"https://wiki.archlinux.org/title/Gaming#Anti-cheat_software","label":"ArchWiki: Gaming anti-cheat ↗"},{"href":"https://areweanticheatyet.com/","label":"AreWeAntiCheatYet ↗"}]},{"term":"Arch","description":"A Linux family known for user control, frequent updates, and hands-on maintenance.","links":[{"href":"https://archlinux.org/","label":"Arch Linux ↗"},{"href":"https://wiki.archlinux.org/title/Arch_Linux","label":"ArchWiki ↗"}]},{"term":"Btrfs","description":"A storage format that can support snapshots, which are saved restore points.","links":[{"href":"https://wiki.archlinux.org/title/Btrfs","label":"ArchWiki: Btrfs ↗"},{"href":"https://btrfs.readthedocs.io/","label":"Btrfs docs ↗"}]},{"term":"Codecs","description":"Small software components that let your computer play or create audio/video formats.","links":[{"href":"https://wiki.archlinux.org/title/Codecs_and_containers","label":"ArchWiki: Codecs and containers ↗"}]},{"term":"Command line / terminal","description":"A text command window used to control the computer by typing commands.","links":[{"href":"https://wiki.archlinux.org/title/Command-line_shell","label":"ArchWiki: Command-line shell ↗"},{"href":"https://www.gnu.org/software/bash/manual/bash.html","label":"GNU Bash manual ↗"}]},{"term":"Config files","description":"Text files that store system or app settings.","links":[{"href":"https://wiki.archlinux.org/title/Dotfiles","label":"ArchWiki: Dotfiles ↗"},{"href":"https://specifications.freedesktop.org/basedir-spec/latest/","label":"XDG base directory spec ↗"}]},{"term":"Containers","description":"Isolated environments for apps or development tools.","links":[{"href":"https://wiki.archlinux.org/title/Linux_Containers","label":"ArchWiki: Linux Containers ↗"},{"href":"https://opencontainers.org/","label":"Open Container Initiative ↗"}]},{"term":"Debian","description":"A Linux family known for stability, long history, and a large software base.","links":[{"href":"https://www.debian.org/","label":"Debian ↗"},{"href":"https://www.debian.org/doc/","label":"Debian documentation ↗"}]},{"term":"Desktop environment","description":"The full graphical interface: panels, menus, settings app, file manager, and window behavior.","links":[{"href":"https://wiki.archlinux.org/title/Desktop_environment","label":"ArchWiki: Desktop environment ↗"}]},{"term":"Distro","description":"Short for Linux distribution: a complete Linux-based operating system you can install.","links":[{"href":"https://wiki.archlinux.org/title/Linux","label":"ArchWiki: Linux ↗"},{"href":"https://distrowatch.com/","label":"DistroWatch ↗"}]},{"term":"Dual boot","description":"Keeping two operating systems installed, such as Windows and Linux, and choosing one when the computer starts.","links":[{"href":"https://wiki.archlinux.org/title/Dual_boot_with_Windows","label":"ArchWiki: Dual boot with Windows ↗"}]},{"term":"Driver","description":"Software that lets the operating system talk to hardware like graphics cards, Wi‑Fi, and printers.","links":[{"href":"https://wiki.archlinux.org/title/Kernel_module","label":"ArchWiki: Kernel module ↗"},{"href":"https://docs.kernel.org/driver-api/index.html","label":"Linux kernel driver docs ↗"}]},{"term":"Firmware","description":"Small built-in software inside hardware devices.","links":[{"href":"https://wiki.archlinux.org/title/Linux_firmware","label":"ArchWiki: Linux firmware ↗"},{"href":"https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/","label":"Linux firmware repository ↗"}]},{"term":"Flatpak","description":"An app format that works across many Linux systems, often installed through graphical app stores.","links":[{"href":"https://docs.flatpak.org/","label":"Flatpak docs ↗"},{"href":"https://wiki.archlinux.org/title/Flatpak","label":"ArchWiki: Flatpak ↗"}]},{"term":"GNOME","description":"A modern, simple Linux desktop interface with a focused workflow.","links":[{"href":"https://www.gnome.org/","label":"GNOME ↗"},{"href":"https://wiki.archlinux.org/title/GNOME","label":"ArchWiki: GNOME ↗"}]},{"term":"GPU","description":"Graphics Processing Unit: the chip/card that handles graphics and games.","links":[{"href":"https://wiki.archlinux.org/title/Hardware_video_acceleration","label":"ArchWiki: Hardware video acceleration ↗"},{"href":"https://docs.mesa3d.org/","label":"Linux graphics stack ↗"}]},{"term":"Homelab","description":"A personal home server setup used for learning, storage, media, networking, or experiments.","links":[{"href":"https://wiki.archlinux.org/title/Category:Server","label":"ArchWiki: Server ↗"},{"href":"https://www.debian.org/doc/manuals/debian-handbook/sect.server-services.en.html","label":"Debian server docs ↗"}]},{"term":"Immutable","description":"A system design where core system files are protected, making updates easier to undo.","links":[{"href":"https://fedoraproject.org/atomic-desktops/","label":"Fedora Atomic Desktops ↗"},{"href":"https://microos.opensuse.org/","label":"openSUSE MicroOS ↗"}]},{"term":"Kernel","description":"The core of the operating system that talks directly to hardware.","links":[{"href":"https://www.kernel.org/","label":"Linux kernel ↗"},{"href":"https://wiki.archlinux.org/title/Kernel","label":"ArchWiki: Kernel ↗"}]},{"term":"KDE Plasma","description":"A highly customizable Linux desktop interface with a traditional Windows-like layout.","links":[{"href":"https://kde.org/plasma-desktop/","label":"KDE Plasma ↗"},{"href":"https://wiki.archlinux.org/title/KDE","label":"ArchWiki: KDE ↗"}]},{"term":"Mesa","description":"Open-source graphics software used by many Linux systems, especially for AMD and Intel graphics.","links":[{"href":"https://docs.mesa3d.org/","label":"Mesa docs ↗"},{"href":"https://wiki.archlinux.org/title/Mesa","label":"ArchWiki: Mesa ↗"}]},{"term":"NVIDIA","description":"A graphics-card maker. Its Linux driver setup can be more sensitive than AMD or Intel.","links":[{"href":"https://wiki.archlinux.org/title/NVIDIA","label":"ArchWiki: NVIDIA ↗"},{"href":"https://www.nvidia.com/en-us/drivers/unix/","label":"NVIDIA Unix drivers ↗"}]},{"term":"Rollback","description":"Going back to an earlier working state after an update or change breaks something.","links":[{"href":"https://wiki.archlinux.org/title/System_backup","label":"ArchWiki: System backup ↗"},{"href":"https://wiki.archlinux.org/title/Snapper","label":"ArchWiki: Snapper ↗"}]},{"term":"Rolling release","description":"An update style where software arrives continuously instead of in big version releases.","links":[{"href":"https://wiki.archlinux.org/title/System_maintenance","label":"ArchWiki: System maintenance ↗"},{"href":"https://archlinux.org/releng/releases/","label":"Arch Linux release model ↗"}]},{"term":"Sandboxed app","description":"An app isolated from the rest of the system to reduce risk and avoid dependency conflicts.","links":[{"href":"https://docs.flatpak.org/en/latest/sandbox-permissions.html","label":"Flatpak sandbox permissions ↗"},{"href":"https://wiki.archlinux.org/title/Firejail","label":"ArchWiki: Firejail ↗"}]},{"term":"Server","description":"A computer mainly used to provide services, such as files, websites, media, or automation.","links":[{"href":"https://wiki.archlinux.org/title/Category:Server","label":"ArchWiki: Server category ↗"},{"href":"https://www.debian.org/doc/manuals/debian-handbook/sect.server-services.en.html","label":"Debian handbook: server services ↗"}]},{"term":"Snap","description":"An app package format associated with Ubuntu/Canonical.","links":[{"href":"https://snapcraft.io/docs","label":"Snapcraft docs ↗"},{"href":"https://wiki.archlinux.org/title/Snap","label":"ArchWiki: Snap ↗"}]},{"term":"Snapshot","description":"A saved restore point of system files, useful for undoing changes.","links":[{"href":"https://wiki.archlinux.org/title/Btrfs#Snapshots","label":"ArchWiki: Btrfs snapshots ↗"},{"href":"https://wiki.archlinux.org/title/Snapper","label":"ArchWiki: Snapper ↗"}]},{"term":"Source code","description":"The human-readable instructions programmers write before software is built.","links":[{"href":"https://www.gnu.org/philosophy/free-sw.html","label":"GNU: free software ↗"},{"href":"https://git-scm.com/doc","label":"Git documentation ↗"}]},{"term":"Stable","description":"Prioritizes reliability and fewer surprises, usually by changing software more slowly.","links":[{"href":"https://www.debian.org/releases/","label":"Debian releases ↗"},{"href":"https://wiki.debian.org/DebianStable","label":"Debian stable ↗"}]},{"term":"Tiling window manager","description":"A window layout where windows automatically arrange themselves without overlapping, often controlled by keyboard shortcuts.","links":[{"href":"https://wiki.archlinux.org/title/Window_manager","label":"ArchWiki: Window manager ↗"},{"href":"https://i3wm.org/docs/userguide.html","label":"i3 user guide ↗"}]},{"term":"Virtual machine / VM","description":"A computer simulated inside your current computer, often used to run another operating system.","links":[{"href":"https://wiki.archlinux.org/title/Virtualization","label":"ArchWiki: Virtualization ↗"},{"href":"https://www.qemu.org/docs/master/","label":"QEMU documentation ↗"}]},{"term":"Wayland","description":"A modern Linux display system that controls how apps draw windows and receive input.","links":[{"href":"https://wayland.freedesktop.org/","label":"Wayland ↗"},{"href":"https://wiki.archlinux.org/title/Wayland","label":"ArchWiki: Wayland ↗"}]},{"term":"Xfce","description":"A lightweight traditional Linux desktop interface, often good for older computers.","links":[{"href":"https://www.xfce.org/","label":"Xfce ↗"},{"href":"https://wiki.archlinux.org/title/Xfce","label":"ArchWiki: Xfce ↗"}]},{"term":"ZFS","description":"An advanced storage system with strong data-management features.","links":[{"href":"https://openzfs.github.io/openzfs-docs/","label":"OpenZFS docs ↗"},{"href":"https://wiki.archlinux.org/title/ZFS","label":"ArchWiki: ZFS ↗"}]}]
