[fallback]
title = "Windows/macOS Fallback Guide | puldistro"
eyebrow = "Migration fallback guide"
hero_title = "Keep <span class=\"gradient\">Windows or macOS</span> available when Linux is not enough."
lead = "A fallback is a safety plan for apps, games, hardware tools, school/work requirements, or creative pipelines that do not work well on Linux yet. It lets you use Linux for most things without gambling your required workflow."
what_title = "What to do?"
what_1_html = "<strong>List your non-negotiables.</strong> Write down required apps, plugins, games, peripherals, file formats, and school/work tools."
what_2_html = "<strong>Test on Linux before deleting anything.</strong> Try a live USB, spare SSD, spare computer, or dual boot setup."
what_3_html = "<strong>Choose the smallest fallback that solves the blocker.</strong> Use web apps first, then VM/remote access, then dual boot or a second machine if needed."
what_4_html = "<strong>Keep backups and recovery media.</strong> Before changing partitions or installing systems, back up important files and make sure you can reinstall or recover."
what_5_html = "<strong>Re-check after a few months.</strong> Linux app/game support changes. A blocker today may be easier later."
rule_html = "<strong>Rule of thumb:</strong> if money, school, work, client files, or competitive games depend on it, keep a proven fallback until you have tested the exact workflow."
why_title = "Why?"
why_1 = "Linux is excellent for web use, development, privacy-focused desktops, many games, servers, and many creative workflows. But some vendors only support Windows or macOS. Professional Adobe pipelines, CAD/BIM tools, accounting software, anti-cheat games, firmware updaters, and hardware control apps are common examples."
why_2 = "A fallback prevents a bad migration: instead of discovering a blocker after wiping your old system, you keep a reliable path for the few tasks that still need Windows or macOS."
possibilities_title = "Fallback possibilities"
quick_title = "Quick recommendation"
quick_text_html = "If you are unsure, start with <strong>dual boot on a separate drive</strong> or <strong>Linux on a spare computer</strong>. That gives you real Linux experience while keeping your old setup intact. Move fully only after your required apps, games, devices, and files work reliably."
check_apps = "Check app alternatives"
read_glossary = "Read the glossary"
take_quiz = "Take the distro quiz"

[about]
title = "About | puldistro"
eyebrow = "About this project"
heading = "A practical helper for choosing Linux."
intro = "puldistro helps newcomers compare Linux distributions and common app alternatives without needing Linux background knowledge."
what_does = "What it does"
does_1 = "Asks plain-language questions about your computer, habits, apps, games, and maintenance comfort."
does_2 = "Recommends Linux distributions and desktop interfaces based on your preferences."
does_3 = "Highlights common migration blockers such as Windows-only apps, anti-cheat games, and vendor hardware utilities."
what_not = "What it does not do"
not_text = "It cannot test your exact computer or guarantee every device, game, or professional app will work. Before replacing Windows, test your real workflow with a live USB, separate drive, dual boot, or spare machine."

[privacy]
title = "Privacy | puldistro"
eyebrow = "Privacy"
heading = "Privacy-friendly by design."
intro = "puldistro is a static website. The quiz runs in your browser and does not require an account."
data_title = "Data collection"
data_1 = "No quiz answers are sent to a server by this site."
data_2 = "No cookies are required for the quiz or glossary."
data_3 = "No analytics or tracking scripts are included in these files."
external_title = "External links"
external_text = "The site links to third-party projects such as Linux distributions, app websites, documentation pages, and compatibility databases. Those websites have their own privacy policies."
storage_title = "Local storage"
storage_text = "The site stores only your light/dark theme preference in local storage so the choice persists across pages. Quiz answers are not stored; refreshing or restarting the quiz resets the answers."

